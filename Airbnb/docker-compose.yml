services:
  postgres:
    image: postgres:17
    container_name: airbnb-postgres
    environment:
      POSTGRES_USER: airbnb_user
      POSTGRES_PASSWORD: airbnb_password
      POSTGRES_DB: airbnb_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airbnb_user -d airbnb_db"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: ./app
    container_name: pipeline_app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: airbnb_db
      DB_USER: airbnb_user
      DB_PASSWORD: airbnb_password
      DATA_DIRS: /data,/mnt/data
    volumes:
      - ./app:/app
      - ./data:/data
    command: ["python", "pipeline.py"]

volumes:
  postgres_data:
